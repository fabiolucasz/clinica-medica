{# Componente para exibição de mensagens Django #}
{% if messages %}
    {% for message in messages %}
    <div class="modern-alert modern-alert-{{ message.tags|default:'info' }}" style="margin-bottom: 1rem;">
        <i class="bi bi-{% if message.tags == 'success' %}check-circle-fill{% elif message.tags == 'error' or message.tags == 'danger' %}x-circle-fill{% elif message.tags == 'warning' %}exclamation-triangle-fill{% else %}info-circle-fill{% endif %}"></i>
        <span>{{ message }}</span>
    </div>
    {% endfor %}
{% endif %}

{% if error %}
<div class="modern-alert modern-alert-danger" style="margin-bottom: 1rem;">
    <i class="bi bi-x-circle-fill"></i>
    <span>{{ error }}</span>
</div>
{% endif %}

{% if success %}
<div class="modern-alert modern-alert-success" style="margin-bottom: 1rem;">
    <i class="bi bi-check-circle-fill"></i>
    <span>{{ success }}</span>
</div>
{% endif %}
