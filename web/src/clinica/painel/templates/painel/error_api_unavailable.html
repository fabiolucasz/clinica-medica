{# Componente reutilizável para erro de API indisponível #}
{% if erro_api %}
<div class="modern-alert modern-alert-danger" style="margin-bottom: 1rem;">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <div>
        <strong>Erro de conexão:</strong> {{ erro_api }}
        <br><small style="color: var(--text-muted);">Tente recarregar a página ou verifique se o servidor está online.</small>
    </div>
</div>
{% endif %}
