{% extends 'painel/base.html' %}
{% load static %}

{% block content %}
{% if error %}
<div class="modern-alert modern-alert-danger mx-auto mt-4" style="max-width: 1000px;">
    <i class="bi bi-x-circle-fill"></i>
    {{ error }}
</div>
{% endif %}

<div style="max-width: 1000px; margin: 0 auto; padding: 2rem 1rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="color: var(--text-primary); margin-bottom: 0.5rem;">
            <i class="bi bi-person-plus me-2"></i>Cadastrar Médico
        </h2>
        <p style="color: var(--text-muted);">Preencha os dados do novo médico</p>
    </div>

    <form method="post" class="modern-form" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
            <!-- Dados Pessoais -->
            <div>
                <h5 style="color: var(--primary-color); margin-bottom: 1.5rem; font-weight: 600;">
                    <i class="bi bi-person me-2"></i>Dados Pessoais
                </h5>
                
                <div class="form-group">
                    <label>Nome Completo *</label>
                    <input type="text" class="form-control" name="nome" placeholder="Nome completo" required>
                </div>
                
                <div class="form-group">
                    <label>Celular *</label>
                    <input type="text" class="form-control" name="celular" placeholder="(00) 00000-0000" required>
                </div>
                
                <div class="form-group">
                    <label>E-mail *</label>
                    <input type="email" class="form-control" name="email" placeholder="email@exemplo.com" required>
                </div>
                
                <div class="form-group">
                    <label>CPF *</label>
                    <input type="text" class="form-control" name="cpf" placeholder="000.000.000-00" required>
                </div>
                
                <div class="form-group">
                    <label>Sexo *</label>
                    <select class="form-control" name="sexo" required>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Data de Nascimento *</label>
                    <input type="date" class="form-control" name="data_nascimento" required>
                </div>
            </div>

            <!-- Endereço -->
            <div>
                <h5 style="color: var(--primary-color); margin-bottom: 1.5rem; font-weight: 600;">
                    <i class="bi bi-geo-alt me-2"></i>Endereço
                </h5>
                
                <div class="form-group">
                    <label>CEP *</label>
                    <input type="text" class="form-control" name="cep" placeholder="00000-000" required>
                </div>
                
                <div class="form-group">
                    <label>Rua *</label>
                    <input type="text" class="form-control" name="rua" placeholder="Nome da rua" required>
                </div>
                
                <div class="form-group">
                    <label>Número *</label>
                    <input type="text" class="form-control" name="numero" placeholder="Número" required>
                </div>
                
                <div class="form-group">
                    <label>Bairro *</label>
                    <input type="text" class="form-control" name="bairro" placeholder="Bairro" required>
                </div>
                
                <div class="form-group">
                    <label>Cidade *</label>
                    <input type="text" class="form-control" name="cidade" placeholder="Cidade" required>
                </div>
                
                <div class="form-group">
                    <label>Estado *</label>
                    <select class="form-control" name="estado" required>
                        <option value="">Selecione</option>
                        {% if estados %}
                        {% for estado in estados %}
                        <option value="{{ estado.id }}">{{ estado.nome }}</option>
                        {% endfor %}
                        {% endif %}
                    </select>
                </div>
            </div>

            <!-- Dados Profissionais -->
            <div>
                <h5 style="color: var(--primary-color); margin-bottom: 1.5rem; font-weight: 600;">
                    <i class="bi bi-briefcase me-2"></i>Dados Profissionais
                </h5>
                
                <div class="form-group">
                    <label>Foto de Perfil</label>
                    <input type="file" class="form-control" name="foto_perfil" accept="image/*">
                </div>
                
                <div class="form-group">
                    <label>Especialidade</label>
                    <select class="form-control" name="especialidade_id">
                        <option value="">Selecione</option>
                        {% if especialidades %}
                        {% for especialidade in especialidades %}
                        <option value="{{ especialidade.id }}">{{ especialidade.nome }}</option>
                        {% endfor %}
                        {% endif %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Conselho Regional</label>
                    <select class="form-control" name="tipo_conselho_id">
                        <option value="">Selecione</option>
                        {% if tipo_conselho %}
                        {% for tipo in tipo_conselho %}
                        <option value="{{ tipo.id }}">{{ tipo.nome }}</option>
                        {% endfor %}
                        {% endif %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label>UF do Conselho</label>
                    <select class="form-control" name="uf_conselho_id">
                        <option value="">Selecione</option>
                        {% if estados %}
                        {% for estado in estados %}
                        <option value="{{ estado.id }}">{{ estado.nome }}</option>
                        {% endfor %}
                        {% endif %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Número do Conselho</label>
                    <input type="text" class="form-control" name="numero_conselho" placeholder="Número do registro">
                </div>
                
                <div class="form-group">
                    <label>RQE</label>
                    <input type="text" class="form-control" name="rqe" placeholder="Registro de Qualificação Especializada">
                </div>
                
                <div class="form-group">
                    <label>Valor da Consulta</label>
                    <input type="text" class="form-control" name="valor_consulta" placeholder="R$ 0,00">
                </div>
                
                <div class="form-group">
                    <label>Documento Profissional</label>
                    <input type="file" class="form-control" name="upload_documento">
                </div>
                
                <div class="form-group">
                    <label>Senha *</label>
                    <input type="password" class="form-control" name="senha" placeholder="Crie uma senha" required>
                </div>
            </div>
        </div>

        <!-- Botões -->
        <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'painel:listar_medicos' %}" class="btn-modern btn-modern-secondary">
                <i class="bi bi-arrow-left me-2"></i>Voltar
            </a>
            <button type="submit" class="btn-modern btn-modern-primary">
                <i class="bi bi-person-plus me-2"></i>Cadastrar Médico
            </button>
        </div>
    </form>
</div>
{% endblock %}
