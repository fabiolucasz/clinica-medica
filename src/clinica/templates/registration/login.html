{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<body class="text-center">
    
<main class="form-signin">
  <form method="post" style="padding-top: 5rem; width: 50%; margin: auto;">
    {% csrf_token %}
    {% load static %}
    {% if error %}
      <div class="alert alert-danger" role="alert">
        {{ error }}
      </div>
    {% endif %}
    
    <!-- Messages framework -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    <img class="mb-4" src="{% static 'img/logo_psi.svg' %}" alt="" width="72" height="57">
    <h1 class="h3 mb-3 fw-normal">Faça seu login</h1>

    <div class="form-floating" style="margin-bottom: 1rem;">
      <input type="text" class="form-control" id="floatingInput" name="username" placeholder="Usuário" required>
      <label for="floatingInput">Usuário</label>
    </div>
    <div class="form-floating" style="margin-bottom: 1rem;">
      <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Senha" required>
      <label for="floatingPassword">Senha</label>
    </div>

    <div class="checkbox mb-3">
      <label>
        <input type="checkbox" value="remember-me"> Lembrar-me
      </label>
    </div>
    <button class="w-100 btn btn-lg btn-primary" type="submit">Entrar</button>
    <p class="mt-5 mb-3 text-muted">© 2026</p>
  </form>
</main>

    
  

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
{% endblock %}
