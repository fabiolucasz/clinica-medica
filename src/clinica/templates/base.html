<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>{% block title %}Clínica Mirna{% endblock %}</title>

  {% load static %}
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      outline: 0;
      padding: 0;
    }


    body {
      background-color: #141B25;
      color: #F8F8F8;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      background-color: #1B222D;
      color: #F8F8F8;
      z-index: 1000;
      overflow-y: hidden;
    }


    .navbar {
      background-color: #1B222D;
      color: #F8F8F8;
      height: 15%;
      top: 0;
      width: 100%;
    }

    .navbar-brand,
    .nav-link {
      color: #F8F8F8 !important;
    }
  </style>
  {% block extra_css %}
  {% endblock %}

</head>
