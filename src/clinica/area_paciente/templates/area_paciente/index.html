{% extends 'base.html' %}

{% block title %}Área do Paciente{% endblock %}

{% block extra_css %}
<style>
  /* Estilos customizados podem ser adicionados aqui */
  .form-floating {
    margin-bottom: 1rem;
  }
</style>
{% endblock %}

{% block content %}

<body class="text-center">
    
<main class="form-signin">
  <form style="padding-top: 15%; width: 50%; margin: auto;">
    {% load static %}
    <img class="mb-4" src="{% static 'img/logo_psi.svg' %}" alt="" width="72" height="57">
    <h1 class="h3 mb-3 fw-normal">Faça seu login</h1>

    <div class="form-floating">
      <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
      <label for="floatingInput">Usuário</label>
    </div>
    <div class="form-floating">
      <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
      <label for="floatingPassword">Senha</label>
    </div>

    <div class="checkbox mb-3">
      <label>
        <input type="checkbox" value="remember-me"> Lembrar-me
      </label>
    </div>
    <button class="w-100 btn btn-lg btn-primary" type="submit">Entrar</button>
    <p class="mt-5 mb-3 text-muted">© 2026</p>
  </form>
</main>

    
  

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
{% endblock %}
