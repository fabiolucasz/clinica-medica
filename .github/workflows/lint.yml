
name: lint

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install linting tools
      run: |
        cd api
        pip install ruff black
    
    - name: Run ruff
      run: |
        cd api
        ruff check src/
    
    - name: Run black check
      run: |
        cd api
        black --check src/